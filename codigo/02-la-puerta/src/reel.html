<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<title>Saberium · Reel 02 · La puerta</title>
<link rel="stylesheet" href="reel.css">
</head><body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <filter id="wet" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.11" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="5 1.5"/>
    </filter>
    <filter id="grainF" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 .7  0 0 0 0 .78  0 0 0 0 1  0 0 0 .55 0"/>
    </filter>
    <filter id="plaster" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.3" numOctaves="3" seed="11"/>
      <feColorMatrix values="0 0 0 0 .55  0 0 0 0 .65  0 0 0 0 1  0 0 0 .5 -0.12"/>
    </filter>
    <linearGradient id="gSkin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#27306b"/><stop offset=".55" stop-color="#141a47"/><stop offset="1" stop-color="#0a0d2c"/>
    </linearGradient>
    <linearGradient id="gFinger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34407f"/><stop offset=".45" stop-color="#1a2156"/><stop offset="1" stop-color="#090c2a"/>
    </linearGradient>
    <linearGradient id="gFingerEnd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05061a" stop-opacity=".85"/><stop offset=".45" stop-color="#05061a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gCuff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef4ff"/><stop offset=".5" stop-color="#b9c9ee"/><stop offset="1" stop-color="#6f80b8"/>
    </linearGradient>
    <linearGradient id="gSleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161b45"/><stop offset=".4" stop-color="#0a0d2a"/><stop offset="1" stop-color="#04051c"/>
    </linearGradient>
    <linearGradient id="gWarmRim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc67a"/><stop offset="1" stop-color="#ffb056" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gThumb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f3a7c"/><stop offset=".5" stop-color="#171d4f"/><stop offset="1" stop-color="#080a26"/>
    </linearGradient>
    <linearGradient id="gDig" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a4690"/><stop offset=".22" stop-color="#1c2460"/><stop offset=".7" stop-color="#0d1138"/><stop offset="1" stop-color="#070922"/></linearGradient>
    <linearGradient id="gNail" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5666bd"/><stop offset="1" stop-color="#222b6b"/></linearGradient>
  </defs>
</svg>

<div id="stage">
  <!-- ============ STREET WORLD (hook, payoff, CTA) ============ -->
  <div id="worldWrap"><div id="world">
    <div id="wall"><svg width="1480" height="2000"><rect width="1480" height="2000" filter="url(#plaster)"/></svg></div>
    <div id="upwin"></div>
    <div id="fascia"><i></i></div>
    <div id="sconce"><b></b><i></i></div>
    <div id="plate"><i></i></div>
    <div id="pipe"></div>
    <div id="win"><div class="winInt" id="winInt"></div><div class="glassTint"></div><div class="refl" id="reflW"></div><div class="sheen"></div></div>
    <div id="riser"></div>
    <div id="pave">
      <div id="joints"></div>
      <div class="streak s1"></div><div class="streak s2"></div><div class="streak s3"></div>
      <div id="spill"></div>
      <div id="sill"></div>
      <div id="mat"></div>
    </div>
    <div id="opening">
      <div id="intClip"><div id="interior"></div><div id="inPhoneGlow"></div></div>
      <div id="jamb"></div>
      <div id="doorP"><div id="leaf"><div id="frame"></div>
        <div id="glass"><div class="glassTint" id="leafTint"></div><div class="refl" id="reflD"></div><div class="sheen"></div><div id="leafDim"></div>
          <div id="sign"><svg id="cord" width="220" height="80" viewBox="0 0 220 80"><path d="M110 6 L24 76 M110 6 L196 76" stroke="#c9d6f5" stroke-width="2" fill="none" opacity=".8"/><circle cx="110" cy="7" r="7" fill="#aab6d8"/><circle cx="110" cy="7" r="3" fill="#3a4370"/></svg>
            <div id="plateWrap"><div id="signPlate"><div class="face front">ABIERTO</div><div class="face back">WEB</div></div></div>
          </div>
        </div>
        <div id="kick"></div>
        <div id="lock"></div>
        <div class="standoff a"></div><div class="standoff b"></div>
        <div id="handle"></div>
      </div></div>
    </div>
    <div id="handW"><svg id="handSvg" width="1000" height="1100" viewBox="-150 -200 1000 1100">
      <g id="handG">
        <!-- sleeve -->
        <path d="M232 71 L775 662 L605 802 L124 161 Z" fill="url(#gSleeve)"/>
        <path d="M232 71 L775 662" stroke="#6f86e0" stroke-width="3" opacity=".75"/>
        <path d="M124 161 L605 802" stroke="#02030f" stroke-width="6" opacity=".6"/>
        <!-- shirt cuff -->
        <path d="M199 50 L226 82 L134 157 L109 124 Z" fill="url(#gCuff)"/>
        <path d="M199 50 L226 82" stroke="#ffffff" stroke-width="2.5" opacity=".9"/>
        <path d="M120 137 L213 62" stroke="#7083bd" stroke-width="2" opacity=".55"/>
        <circle cx="140" cy="134" r="5" fill="#7f90c8"/>
        <!-- back of hand -->
        <path d="M40 -80 C84 -92 132 -66 160 -22 C178 6 190 30 197 51 L111 123 C96 106 62 86 38 68 C26 30 26 -32 40 -80 Z" fill="url(#gSkin)"/>
        <path d="M150 20 C166 40 176 52 182 62" stroke="#0a0d2c" stroke-width="3" opacity=".5" fill="none"/>
        <!-- fingers wrapping the bar -->
        <g id="fingers">
          <g transform="rotate(-5 30 -58)"><rect x="-36" y="-75" width="92" height="34" rx="17" fill="url(#gFinger)"/><rect x="-36" y="-75" width="92" height="34" rx="17" fill="url(#gFingerEnd)"/><path d="M-22 -73 H36" stroke="#8fb4ff" stroke-width="2" opacity=".55" stroke-linecap="round"/></g>
          <g transform="rotate(-1 30 -22)"><rect x="-40" y="-40" width="98" height="35" rx="17.5" fill="url(#gFinger)"/><rect x="-40" y="-40" width="98" height="35" rx="17.5" fill="url(#gFingerEnd)"/><path d="M-26 -38 H38" stroke="#8fb4ff" stroke-width="2" opacity=".45" stroke-linecap="round"/></g>
          <g transform="rotate(3 30 14)"><rect x="-37" y="-4" width="94" height="34" rx="17" fill="url(#gFinger)"/><rect x="-37" y="-4" width="94" height="34" rx="17" fill="url(#gFingerEnd)"/><path d="M-22 -2 H36" stroke="#8fb4ff" stroke-width="2" opacity=".35" stroke-linecap="round"/></g>
          <g transform="rotate(8 30 46)"><rect x="-30" y="31" width="84" height="30" rx="15" fill="url(#gFinger)"/><rect x="-30" y="31" width="84" height="30" rx="15" fill="url(#gFingerEnd)"/><path d="M-16 33 H32" stroke="#8fb4ff" stroke-width="2" opacity=".3" stroke-linecap="round"/></g>
          <path id="rimWarm" d="M-37 -66 q-6 9 0 18 M-41 -31 q-6 9 0 18 M-38 5 q-6 9 0 17 M-31 39 q-5 8 0 15" stroke="#ffbe6e" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8"/>
        </g>
        <!-- knuckles -->
        <path d="M52 -74 q10 14 4 30 M58 -38 q9 14 3 30 M56 -2 q8 13 2 28 M50 34 q7 11 2 24" stroke="#4c5aa8" stroke-width="2.5" fill="none" opacity=".55" stroke-linecap="round"/>
        <!-- thumb resting over the bar -->
        <path d="M146 -44 C120 -76 62 -108 14 -122 C-10 -128 -22 -98 0 -88 C36 -74 66 -52 92 -20 Z" fill="url(#gThumb)"/>
        <path d="M146 -44 C120 -76 62 -108 14 -122 C2 -125 -8 -119 -11 -110" stroke="#9cc8ff" stroke-width="2.4" fill="none" opacity=".65" stroke-linecap="round"/>
        <path d="M-6 -112 C0 -120 14 -118 22 -112 C18 -102 6 -96 -2 -98 Z" fill="#3f4b96" opacity=".7"/>
        <!-- cool rim along the back of the hand -->
        <path d="M150 -36 C170 -8 188 26 197 51" stroke="#9cc8ff" stroke-width="2.5" fill="none" opacity=".5"/>
      </g>
    </svg></div>
  </div></div>
  <div id="fg"><div id="post"></div><div id="car"><i></i><b></b></div></div>

  <!-- ============ BACKDROP for phone scenes (the same street, out of focus) ============ -->

  <!-- ============ INTERIOR WORLD ============ -->
  <div id="inWrap"><div id="inWorld"></div></div>

  <!-- ============ PHONE ============ -->
  <div id="phoneGlow"></div>
  <div id="phone">
    <div id="screen">
      <div id="scrSearch" class="scr"></div>
      <div id="scrPage" class="scr"></div>
      <div id="scrSite" class="scr"></div>
      <div id="statusbar"><span id="sbTime">22:04</span><span class="sbR"><i class="sig"></i><i class="bat"></i></span></div>
      <div id="island"></div>
      <div id="scrGlass"></div>
    </div>
  </div>
  <div id="digits"></div>

  <!-- ============ UI: glass panels, labels ============ -->
  <div id="scrim"></div><div id="scrim2"></div>
  <div id="panels"></div>

  <!-- ============ captions ============ -->
  <div id="caps"></div>
  <div id="title"></div>
  <div id="cta"></div>
  <div id="endcard"><img id="endLogo" src="logo-blanco.png"><div id="endUrl">saberium.com · @saberium.studio</div></div>

  <div id="brand"><img src="icono-blanco.png"><span>SABERIUM</span></div>
  <div id="clock"><i></i><span id="clockT"></span></div>
  <div id="grain"><svg width="1080" height="1920"><rect width="1080" height="1920" filter="url(#grainF)"/></svg></div>
  <div id="vig"></div>
</div>
<script src="engine.js"></script>
<script src="scenes_a.js"></script>
<script src="scenes_b.js"></script>
<script src="scenes_c.js"></script>
</body></html>
